apiVersion: apps/v1
kind: Deployment
metadata:
  name: odoo-deployment
  labels:
    app: odoo
    env: prod
spec:
  selector:
    matchLabels:
      app: odoo
  template:
    metadata:
      labels:
        app: odoo
        env: prod
    spec:
      initContainers:
      - name: fix-permissions
        image: odoo:17.0
        securityContext:
          runAsUser: 0
        command: ["sh", "-c", "chown -R odoo:odoo /var/lib/odoo"]
        volumeMounts:
        - name: odoo-data
          mountPath: /var/lib/odoo
      containers:
      - name: odoo
        image: odoo:17.0
        env:
        - name: USER
          valueFrom:
            secretKeyRef:
              key: user
              name: odoo-secret
        - name: PASSWORD
          valueFrom:
            secretKeyRef:
              key: password
              name: odoo-secret
        - name: HOST
          valueFrom:
            configMapKeyRef:
              key: host
              name: odoo-cm
        ports:
        - containerPort: 8069
        volumeMounts:
        - name: odoo-data
          mountPath: /var/lib/odoo
      volumes:
      - name: odoo-data
        persistentVolumeClaim:
          claimName: odoo-pvc